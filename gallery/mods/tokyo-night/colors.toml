# Colours of the Tokyo Night theme, made by spacetify from the
# Tokyo Night palette (https://github.com/enkia/tokyo-night-vscode-theme, MIT licence).
#
# Every one of Spotify's 16 colour sets is set, so no Spotify green is
# left anywhere. The full list of sets and colours is in docs/themes.md.

