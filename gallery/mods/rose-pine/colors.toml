# Colours of the Rosé Pine theme, made by spacetify from the
# Rosé Pine palette (https://github.com/rose-pine/rose-pine-theme, MIT licence).
#
# Every one of Spotify's 16 colour sets is set, so no Spotify green is
# left anywhere. The full list of sets and colours is in docs/themes.md.

