# Colours of the Nightlight theme, made by spacetify from the
# `Nightlight Colors` scheme of Spicetify's Nightlight theme by the Spicetify team
# (https://github.com/spicetify/spicetify-themes).
#
# Every one of Spotify's 16 colour sets is set, so no Spotify green is
# left anywhere, and every text was checked against its background.
# The full list of sets and colours is in docs/themes.md.

# The general look of the app.
[base]
background-base = "#1c1622"
background-highlight = "#332d38"
background-press = "#19141f"
background-elevated-base = "#241c2c"
background-elevated-highlight = "#362e3d"
