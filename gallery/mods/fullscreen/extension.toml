# Full Screen, a spacetify extension. See docs/extensions.md for every field.

id = "fullscreen"
name = "Full Screen"
version = "1.0.0"
author = "spacetify"
description = "Shows the song playing full screen: big cover, blurred background, progress and controls."
spacetify = ">=0.4.0"

# Every selector the code relies on, checked by `spacetify doctor`.
selectors = [
  '[data-testid="volume-bar"]',
  '[data-testid="now-playing-widget-v2"]',
  '[data-testid="now-playing-widget-v2-byline"]',
  '[data-testid="context-item-link"]',
  '[data-testid="cover-art-image"]',
  '[data-testid="playback-progressbar"]',
  '[data-testid="control-button-playpause"]',
  '[data-testid="control-button-skip-back"]',
  '[data-testid="control-button-skip-forward"]',
  '[data-testid="control-button-shuffle"]',
  '[data-testid="control-button-repeat"]',
]

[settings.blur]
type = "boolean"
default = true
label = "Blurred cover in the background"

[settings.controls]
type = "boolean"
default = true
label = "Show the playback controls"

[settings.shortcut]
type = "boolean"
default = true
label = "Open with the F key"

[settings.window]
type = "boolean"
default = false
label = "Hide the window borders too"
