# Colours of the Turntable theme, made by spacetify from the
# `turntable` scheme of Spicetify's Turntable theme by Grason Chan
# (https://github.com/spicetify/spicetify-themes).
#
# Every one of Spotify's 16 colour sets is set, so no Spotify green is
# left anywhere, and every text was checked against its background.
# The full list of sets and colours is in docs/themes.md.

# The general look of the app.
[base]
background-base = "#121212"
background-highlight = "#2a2a2a"
background-press = "#101010"
background-elevated-base = "#1f1f1f"
background-elevated-highlight = "#313131"
background-elevated-press = "#101010"
background-tinted-base = "#ffffff1a"
background-tinted-highlight = "#ffffff26"
background-tinted-press = "#ffffff12"
text-base = "#ffffff"
text-subdued = "#b3b3b3"
text-bright-accent = "#1ed760"
text-negative = "#e5534b"
text-warning = "#e5b84b"
text-positive = "#1ed760"
text-announcement = "#5aa9e6"
essential-base = "#ffffff"
essential-subdued = "#8b8b8b"
