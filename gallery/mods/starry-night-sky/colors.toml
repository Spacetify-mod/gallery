text-base = "#ffffff"
text-subdued = "#757880"
text-bright-accent = "#fff3c4"
text-negative = "#e22134"
text-warning = "#e5b84b"
text-positive = "#57c785"
text-announcement = "#4687d6"
essential-base = "#ffffff"
