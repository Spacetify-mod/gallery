# Colours of the Dreary · Mono theme, made by spacetify from the
# `Mono` scheme of Spicetify's Dreary theme by CharlieS1103
# (https://github.com/spicetify/spicetify-themes).
#
# Every one of Spotify's 16 colour sets is set, so no Spotify green is
# left anywhere, and every text was checked against its background.
# The full list of sets and colours is in docs/themes.md.

# The general look of the app.
[base]
background-base = "#000000"
background-highlight = "#1a1a1a"
background-press = "#000000"
background-elevated-base = "#5d5e60"
background-elevated-highlight = "#6a6b6d"
background-elevated-press = "#000000"
background-tinted-base = "#ffffff1a"
background-tinted-highlight = "#ffffff26"
background-tinted-press = "#ffffff12"
text-base = "#ffffff"
text-subdued = "#d3d3d3"
text-bright-accent = "#d3d3d3"
text-negative = "#e5534b"
text-warning = "#e5b84b"
text-positive = "#57c785"
text-announcement = "#5aa9e6"
essential-base = "#ffffff"
essential-subdued = "#9e9e9e"
essential-bright-accent = "#d3d3d3"
essential-negative = "#e5534b"
essential-warning = "#e5b84b"
essential-positive = "#57c785"
essential-announcement = "#5aa9e6"
decorative-base = "#ffffff"
decorative-subdued = "#5d5e60"

