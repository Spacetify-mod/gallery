# Colours of the Sleek · Ultra Black theme, made by spacetify from the
# `UltraBlack` scheme of Spicetify's Sleek theme by harbassan
# (https://github.com/spicetify/spicetify-themes).
#
# Every one of Spotify's 16 colour sets is set, so no Spotify green is
# left anywhere, and every text was checked against its background.
# The full list of sets and colours is in docs/themes.md.

# The general look of the app.
[base]
background-base = "#000000"
background-highlight = "#1a1a1a"
