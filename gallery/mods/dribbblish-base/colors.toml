text-base = "#ffffff"
text-subdued = "#f0f0f0"
text-bright-accent = "#24b558"
text-negative = "#e22134"
text-warning = "#e5b84b"
text-positive = "#24b558"
text-announcement = "#5aa9e6"
essential-base = "#ffffff"
essential-subdued = "#b4b4b4"
